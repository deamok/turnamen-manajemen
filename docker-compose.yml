version: '3.8'

services:
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: turnamen-tenis-meja-frontend
    ports:
      # Port 8088 pada host (Ubuntu server) diarahkan ke port 80 pada container Nginx
      - "8082:80"
    restart: always
    environment:
      - NODE_ENV=production
